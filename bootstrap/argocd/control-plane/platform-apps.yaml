apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
        revision: main
        files:
          - path: app-configs/*.yaml

  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  # Lists are replaced by the patch: retain both sources and their current fields.
  # An explicit empty object is a no-op for applications without the override.
  templatePatch: |
    {{- if hasKey . "overrideValuesFile" }}
    {{- if not (and (kindIs "string" .overrideValuesFile) (ne .overrideValuesFile "")) }}
    {{- fail "overrideValuesFile must be a nonempty string" }}
    {{- end }}
    spec:
      sources:
        - repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
          targetRevision: main
          path: charts/web-app
          helm:
            releaseName: {{ .name | toJson }}
            valueFiles:
              - {{ printf "$chart-repo/%s" .valuesFile | toJson }}
              - {{ printf "$chart-repo/%s" .overrideValuesFile | toJson }}
        - repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
          targetRevision: main
          ref: chart-repo
    {{- else }}
    {}
    {{- end }}

  template:
    metadata:
      name: '{{.name}}'

    spec:
      project: secure-platform

      sources:
        - repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
          targetRevision: main
          path: charts/web-app

          helm:
            releaseName: '{{.name}}'
            valueFiles:
              - '$chart-repo/{{.valuesFile}}'

        - repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
          targetRevision: main
          ref: chart-repo

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
