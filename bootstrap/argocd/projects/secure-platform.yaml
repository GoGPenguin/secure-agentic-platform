apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secure-platform
  namespace: argocd
spec:
  namespaceResourceWhitelist:
  - group: ''
    kind: 'ServiceAccount'
  - group: ''
    kind: 'Service'
  - group: 'apps'
    kind: 'Deployment'
  destinations:
  - namespace: 'gitops-apps'
    server: 'https://kubernetes.default.svc'
  sourceRepos:
  - 'https://github.com/GoGPenguin/secure-agentic-platform.git'

