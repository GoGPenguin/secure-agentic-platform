apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-reporting-rbac
  namespace: argocd
spec:
  project: secure-kyverno-reporting-rbac
  source:
    repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
    targetRevision: main
    path: security/kyverno-reporting-rbac
    directory:
      recurse: false
      include: reports-ephemeralcontainers.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - FailOnSharedResource=true
      - Prune=false
