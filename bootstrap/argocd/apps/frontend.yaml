apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: secure-platform
  sources:
  - repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
    targetRevision: main
    path: charts/web-app
    helm:
      valueFiles:
      - $chart-repo/environments/frontend-values.yaml
  - repoURL: https://github.com/GoGPenguin/secure-agentic-platform.git
    targetRevision: main
    ref: chart-repo
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-apps
  syncPolicy:
    automated:
      prune: false
      selfHeal: true   
    syncOptions:
    - CreateNamespace=true
