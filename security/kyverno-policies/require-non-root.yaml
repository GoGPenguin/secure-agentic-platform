apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gitops-apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, daemonsets, replicasets, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - message: Containers must effectively set runAsNonRoot to true and must not use UID 0.
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(
            variables.podSpec.?securityContext.?runAsNonRoot.orValue(false)) &&
          c.?securityContext.?runAsUser.orValue(
            variables.podSpec.?securityContext.?runAsUser.orValue(-1)) != 0)
