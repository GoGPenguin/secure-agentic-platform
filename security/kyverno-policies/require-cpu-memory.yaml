apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-cpu-memory
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gitops-apps
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, daemonsets, replicasets, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([])
  validations:
    - message: Every regular and init container must specify CPU and memory requests and limits.
      expression: >-
        variables.containers.all(c,
          ['cpu', 'memory'].all(key,
            key in c.?resources.?requests.orValue({}) &&
            key in c.?resources.?limits.orValue({})))
