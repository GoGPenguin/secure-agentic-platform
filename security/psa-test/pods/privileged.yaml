apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: psa-restricted-test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: api
    image: ghcr.io/gogpenguin/secure-agentic-platform/platform-api@sha256:9714e2a64a7ad5b3af396b0c9fd3958245259cf7a536d748df378e21e30f0421
    securityContext:
      # Privileged requires escalation; false would be an API validation conflict.
      allowPrivilegeEscalation: true
      capabilities:
        drop:
        - ALL
      privileged: true
