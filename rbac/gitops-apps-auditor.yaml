apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: w09-auditor
  namespace: gitops-apps
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: w09-auditor
  namespace: gitops-apps
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: w09:auditor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: w09-auditor
