name: platform-ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Helm chart
        run: helm lint charts/web-app

      - name: Render frontend
        run: helm template frontend charts/web-app -f environments/frontend-values.yaml

      - name: Render backend
        run: helm template backend charts/web-app -f environments/backend-values.yaml

      - name: Render sandbox
        run: helm template sandbox charts/web-app -f environments/sandbox-values.yaml

  platform-api-ci:
    name: Platform API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.16.1'
          package_json_file: services/platform-api/package.json
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run HTTP-level tests
        run: pnpm run test:e2e

      - name: Build TypeScript application
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t platform-api:ci .
