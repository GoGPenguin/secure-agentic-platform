name: platform-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rbac-validation:
    name: RBAC Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/rbac-venv"
          "$RUNNER_TEMP/rbac-venv/bin/pip" install PyYAML==6.0.3
      - name: Validate least-privilege policy and test checker failure paths
        run: |
          "$RUNNER_TEMP/rbac-venv/bin/python" scripts/check-rbac.py
          "$RUNNER_TEMP/rbac-venv/bin/python" scripts/test-rbac-checks.py

  monitoring-validation:
    name: Monitoring Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/monitoring-venv"
          "$RUNNER_TEMP/monitoring-venv/bin/pip" install PyYAML==6.0.3

      - name: Validate rollout checksum and extract configuration
        run: |
          "$RUNNER_TEMP/monitoring-venv/bin/python" scripts/validate-prometheus-config.py \
            --output-config "$RUNNER_TEMP/prometheus.yml"

      - name: Validate configuration with the deployed Prometheus image
        run: |
          prometheus_image=$("$RUNNER_TEMP/monitoring-venv/bin/python" -c 'import yaml; print(yaml.safe_load(open("monitoring/prometheus/deployment.yaml"))["spec"]["template"]["spec"]["containers"][0]["image"])')
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/prometheus.yml,dst=/etc/prometheus/prometheus.yml,readonly" \
            --entrypoint /bin/promtool "$prometheus_image" \
            check config /etc/prometheus/prometheus.yml

  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Helm chart
        run: helm lint charts/web-app

      - name: Render frontend
        run: helm template frontend charts/web-app -f environments/frontend-values.yaml

      - name: Render backend
        run: helm template backend charts/web-app -f environments/backend-values.yaml

      - name: Render sandbox
        run: helm template sandbox charts/web-app -f environments/sandbox-values.yaml

      - name: Validate Platform API chart values
        run: |
          helm lint charts/web-app -f environments/platform-api-values.yaml
          helm template platform-api charts/web-app -f environments/platform-api-values.yaml

  platform-api-ci:
    name: Platform API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.16.1'
          package_json_file: services/platform-api/package.json
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      - name: Run HTTP-level tests
        run: pnpm run test:e2e

      - name: Build TypeScript application
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t platform-api:ci .

  publish-platform-api:
    name: Publish Platform API
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [helm-validation, platform-api-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/gogpenguin/secure-agentic-platform/platform-api
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image-reference: ${{ steps.summary.outputs.image-reference }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Platform API
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/platform-api
          file: services/platform-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published image
        id: summary
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Registry returned an invalid image digest" >&2
            exit 1
          fi
          image_reference="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          printf 'image-reference=%s\n' "$image_reference" >> "$GITHUB_OUTPUT"
          {
            printf '### Published Platform API\n\n'
            printf 'Tag: %s:sha-%s\n\n' "$IMAGE_REPOSITORY" "$GITHUB_SHA"
            printf 'Digest: %s\n\n' "$IMAGE_DIGEST"
            printf 'Immutable image reference: %s\n\n' "$image_reference"
            printf 'Promote this digest through a reviewed GitOps PR.\n'
          } >> "$GITHUB_STEP_SUMMARY"
