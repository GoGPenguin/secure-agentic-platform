apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 5s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
