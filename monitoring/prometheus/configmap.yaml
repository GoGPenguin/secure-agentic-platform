apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 5s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      - job_name: platform-api
        scheme: http
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["gitops-apps"]
            selectors:
              - role: pod
                label: "app.kubernetes.io/name=web-app,app.kubernetes.io/instance=platform-api"

        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
            regex: "web-app;platform-api"

          - action: keep
            source_labels:
              - __meta_kubernetes_pod_container_name
              - __meta_kubernetes_pod_container_init
              - __meta_kubernetes_pod_container_port_name
              - __meta_kubernetes_pod_container_port_number
              - __meta_kubernetes_pod_container_port_protocol
            regex: "web-app;false;http;3000;TCP"

          - action: keep
            source_labels: [__meta_kubernetes_pod_phase]
            regex: Running

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_uid]
            target_label: pod_uid
