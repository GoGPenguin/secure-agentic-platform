apiVersion: 1
groups:
  - orgId: 1
    name: platform-api-http
    folder: Platform
    interval: 30s
    rules:
      - uid: platform-api-http-5xx
        title: Platform API HTTP 5xx above 5%
        condition: B
        for: 1m
        keepFiringFor: 0s
        noDataState: NoData
        execErrState: Error
        isPaused: false
        labels:
          service: platform-api
          severity: warning
        annotations:
          summary: Platform API HTTP 5xx exceeds 5% with at least 100 requests in five minutes
          description: A is the traffic-qualified percentage; below 100 requests it is zero. Missing or unhealthy telemetry is No Data, not zero errors.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: |
                (
                  (
                    100 *
                    (
                      sum(increase(http_requests_total{job="platform-api",status_code=~"5.."}[5m]))
                      or
                      0 * sum(increase(http_requests_total{job="platform-api"}[5m]))
                    )
                    /
                    clamp_min(sum(increase(http_requests_total{job="platform-api"}[5m])), 1)
                  )
                  *
                  (sum(increase(http_requests_total{job="platform-api"}[5m])) >= bool 100)
                )
                and on()
                (min(up{job="platform-api"}) == 1)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
