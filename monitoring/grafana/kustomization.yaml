apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: grafana-config
    files:
      - grafana.ini=config/grafana.ini
  - name: grafana-datasources
    files:
      - prometheus.yaml=config/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboard-provider.yaml=config/dashboard-provider.yaml
  - name: grafana-dashboards
    files:
      - platform-api.json=dashboards/platform-api.json
generatorOptions:
  # Match prune=false without accumulating obsolete generated ConfigMaps.
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
