replicaCount: 1

image:
  repository: ghcr.io/gogpenguin/secure-agentic-platform/platform-api
  digest: sha256:48ec5b5fe780bcd39fc5e1e09912b08acf4ccb777f1e37fab49d80452222b3c5
  pullPolicy: IfNotPresent

container:
  port: 3000

service:
  type: ClusterIP
  port: 3000

serviceAccount:
  create: true
  name: platform-api
  automount: false

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: false

httpRoute:
  enabled: false

autoscaling:
  enabled: false
