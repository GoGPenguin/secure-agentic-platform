- apiVersion: apps/v1
  kind: Deployment
  name: kyverno-admission-controller
  namespace: kyverno
  replicas: 2
  serviceAccountName: kyverno-admission-controller
  initContainers:
  - name: kyverno-pre
    image: reg.kyverno.io/kyverno/kyvernopre:v1.20.0
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    args:
    - --loggingFormat=text
    - --v=2
    - --openreportsEnabled=false
  containers:
  - name: kyverno
    image: reg.kyverno.io/kyverno/kyverno:v1.20.0
    resources:
      limits:
        cpu: '1'
        memory: 384Mi
      requests:
        cpu: 100m
        memory: 128Mi
    args:
    - --caSecretName=kyverno-svc.kyverno.svc.kyverno-tls-ca
    - --tlsSecretName=kyverno-svc.kyverno.svc.kyverno-tls-pair
    - --tlsKeyAlgorithm=RSA
    - --backgroundServiceAccountName=system:serviceaccount:kyverno:kyverno-background-controller
    - --reportsServiceAccountName=system:serviceaccount:kyverno:kyverno-reports-controller
    - --servicePort=443
    - --webhookServerPort=9443
    - --resyncPeriod=15m
    - --crdWatcher=false
    - --disableMetrics=false
    - --otelConfig=prometheus
    - --metricsPort=8000
    - --admissionReports=true
    - --maxAdmissionReports=1000
    - --autoUpdateWebhooks=true
    - --excludeBootstrapResources=true
    - --enableConfigMapCaching=true
    - --controllerRuntimeMetricsAddress=:8080
    - --enableDeferredLoading=true
    - --dumpPayload=false
    - --forceFailurePolicyIgnore=false
    - --generateValidatingAdmissionPolicy=false
    - --generateMutatingAdmissionPolicy=false
    - --dumpPatches=false
    - --maxAPICallResponseLength=2000000
    - --apiCallTimeout=30s
    - --maxGlobalContextEntries=0
    - --loggingFormat=text
    - --v=2
    - --omitEvents=PolicyApplied,PolicySkipped
    - --enablePolicyException=false
    - --protectManagedResources=false
    - --protectGenerationLabels=true
    - --allowInsecureRegistry=false
    - --registryCredentialHelpers=default,google,amazon,azure,github
    - --enableReporting=validate,mutate,mutateExisting,imageVerify,generate
- apiVersion: apps/v1
  kind: Deployment
  name: kyverno-background-controller
  namespace: kyverno
  replicas: 1
  serviceAccountName: kyverno-background-controller
  containers:
  - name: controller
    image: reg.kyverno.io/kyverno/background-controller:v1.20.0
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
    args:
    - --disableMetrics=false
    - --otelConfig=prometheus
    - --metricsPort=8000
    - --resyncPeriod=15m
    - --crdWatcher=false
    - --enableConfigMapCaching=true
    - --controllerRuntimeMetricsAddress=:8080
    - --enableDeferredLoading=true
    - --maxAPICallResponseLength=2000000
    - --apiCallTimeout=30s
    - --maxGlobalContextEntries=0
    - --loggingFormat=text
    - --v=2
    - --omitEvents=PolicyApplied,PolicySkipped
    - --enablePolicyException=false
    - --enableReporting=validate,mutate,mutateExisting,imageVerify,generate
- apiVersion: apps/v1
  kind: Deployment
  name: kyverno-cleanup-controller
  namespace: kyverno
  replicas: 1
  serviceAccountName: kyverno-cleanup-controller
  containers:
  - name: controller
    image: reg.kyverno.io/kyverno/cleanup-controller:v1.20.0
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
    args:
    - --caSecretName=kyverno-cleanup-controller.kyverno.svc.kyverno-tls-ca
    - --tlsSecretName=kyverno-cleanup-controller.kyverno.svc.kyverno-tls-pair
    - --tlsKeyAlgorithm=RSA
    - --servicePort=443
    - --resyncPeriod=15m
    - --cleanupServerPort=9443
    - --disableMetrics=false
    - --otelConfig=prometheus
    - --metricsPort=8000
    - --enableDeferredLoading=true
    - --dumpPayload=false
    - --maxAPICallResponseLength=2000000
